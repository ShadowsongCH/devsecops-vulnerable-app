version: 2
updates:
  # -------------------------------------------------------------
  # 1. Python Dependencies (pip / requirements.txt)
  # -------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "build(deps)"

  # -------------------------------------------------------------
  # 2. Docker Base Images (Dockerfile)
  # -------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "build(docker)"

  # -------------------------------------------------------------
  # 3. GitHub Actions Workflows (.github/workflows)
  # -------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
