name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write  # Required to upload SARIF reports to GitHub Code Security
  issues: write           # Allow OWASP ZAP to open GitHub Issues

jobs:
  security-scan:
    name: DevSecOps Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks commit history scanning

      # -------------------------------------------------------------
      # 1. SAST (Static Application Security Testing) - Semgrep
      # -------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan --config=auto --sarif --output=semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      # -------------------------------------------------------------
      # 2. Secret Detection - Gitleaks
      # -------------------------------------------------------------
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 3. SCA (Software Composition Analysis) - pip-audit
      # -------------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit SCA
        run: pip-audit -r requirements.txt

      # -------------------------------------------------------------
      # 4. Container Security - Docker Build & Trivy Scan
      # -------------------------------------------------------------
      - name: Build Local Docker Image
        run: |
          docker build --no-cache -t vulnerable-app:test .

      - name: Run Trivy Container Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-app:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'  # Audits all actionable severity levels without suppression
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # -------------------------------------------------------------
      # 5. DAST (Dynamic Application Security Testing) - OWASP ZAP
      # -------------------------------------------------------------
      - name: Build and Run Application Container
        run: |
          docker build -t vulnerable-app:test .
          docker run -d --network=host --name test-app vulnerable-app:test
          sleep 5
          curl -I http://localhost:5000 || exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:5000'
          issue_title: 'OWASP ZAP Security Report'
          fail_action: false # Set to true to break pipeline on WARN/FAIL findings

      - name: Stop Application Container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true
