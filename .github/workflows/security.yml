name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write  # Required to upload SARIF reports to GitHub Code Security

jobs:
  security-scan:
    name: DevSecOps Security Pipeline
    runs-on: ubuntu-latest
    
    services:
      floci-az:
        image: floci/floci-az:latest
        ports:
          - 4577:4577
          - 5672:5672
          - 5673:5673
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks commit history scanning

      # -------------------------------------------------------------
      # 1. SAST (Static Application Security Testing) - Semgrep
      # -------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan --config=auto --sarif --output=semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      # -------------------------------------------------------------
      # 2. Secret Detection - Gitleaks
      # -------------------------------------------------------------
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 3. SCA (Software Composition Analysis) - pip-audit
      # -------------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit SCA
        run: pip-audit -r requirements.txt

      # -------------------------------------------------------------
      # 4. Container Security - Docker Build & Trivy Scan
      # -------------------------------------------------------------
      - name: Build Local Docker Image
        run: |
          docker build --no-cache -t vulnerable-app:test .

      - name: Run Trivy Container Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-app:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # -------------------------------------------------------------
      # 5. DAST (Dynamic Application Security Testing) - OWASP ZAP
      # -------------------------------------------------------------
      - name: Start Application Container
        run: |
          docker run -d --name flask-app -p 5000:5000 vulnerable-app:test
          echo "Waiting for app to start..."
          sleep 5
          curl --retry 5 --retry-connrefused --retry-delay 2 http://localhost:5000

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:5000'
          issue_title: 'OWASP ZAP DAST Vulnerability Report'
          fail_action: false # Set to true to break pipeline on WARN/FAIL findings

      - name: Stop Application Container
        if: always()
        run: |
          docker stop flask-app || true
          docker rm flask-app || true

      # -------------------------------------------------------------
      # 7. floci Azure
      # -------------------------------------------------------------
      - name: Test Azure Storage Integration in CI
        env:
          CONN_STR: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=REDACTED-DEV-SECRET;BlobEndpoint=http://localhost:4577/devstoreaccount1;"
        run: |
          pip install azure-storage-blob
          python -c "
          from azure.storage.blob import BlobServiceClient
          client = BlobServiceClient.from_connection_string('$CONN_STR')
          client.create_container('ci-test-container')
          print('CI Azure Connection Successful!')
          "
