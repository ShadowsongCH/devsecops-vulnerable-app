name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-gates:
    name: Security Scans (SAST, Secrets, SCA, Container)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools (Semgrep & Pip-audit)
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep pip-audit

      - name: Run Semgrep SAST Gate
        run: |
          semgrep scan --config p/python --error .

      - name: Install Gitleaks Binary
        run: |
          cd /tmp
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Secret Gate
        run: |
          gitleaks detect --verbose --redact

      - name: Run Pip-audit SCA Gate (Dependency Scanning)
        run: |
          pip-audit -r requirements.txt

      - name: Build Local Docker Image for Scanning
        run: |
          docker build -t vulnerable-app:test .

      - name: Run Trivy Container Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
