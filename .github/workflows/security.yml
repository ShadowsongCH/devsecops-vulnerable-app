name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write  # Required to upload SARIF reports to GitHub Code Security
  issues: write           # Allow OWASP ZAP to open GitHub Issues

jobs:
  security-scan:
    name: DevSecOps Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0 # Required for Gitleaks commit history scanning

      # -------------------------------------------------------------
      # 1. SAST (Static Application Security Testing) - Semgrep
      # -------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan --config=auto --sarif --output=semgrep.sarif --error

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@c20e34f438d671fc35777cc9820dd7adf8252874
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      # -------------------------------------------------------------
      # 2. Secret Detection - Gitleaks
      # -------------------------------------------------------------
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 3. SCA (Software Composition Analysis) - pip-audit
      # -------------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit SCA
        run: pip-audit -r requirements.txt

      # -------------------------------------------------------------
      # 4. Container Security - Docker Build & Trivy Scan
      # -------------------------------------------------------------
      - name: Build Local Docker Image
        run: |
          docker build --no-cache -t vulnerable-app:test .

      - name: Run Trivy Container Scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'vulnerable-app:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          limit-severities-for-sarif: false
          exit-code: '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Trivy Report Exists
        run: ls -la trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@c20e34f438d671fc35777cc9820dd7adf8252874
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

      # -------------------------------------------------------------
      # 5. DAST (Dynamic Application Security Testing) - OWASP ZAP
      # -------------------------------------------------------------
      - name: Build and Run Application Container
        run: |
          docker build -t vulnerable-app:test .
          docker run -d --network=host --name test-app vulnerable-app:test
          sleep 5
          curl -I http://localhost:5000 || exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:5000'
          issue_title: 'OWASP ZAP Security Report'
          fail_action: false # Set to true to break pipeline on WARN/FAIL findings

      - name: Stop Application Container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true

